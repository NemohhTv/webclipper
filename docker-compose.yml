services:
  webclipper:
    build: .
    container_name: webclipper
    ports:
      - "9069:9069"
    environment:
      WEBCLIPPER_DATA_DIR: /data
    volumes:
      - webclipper_data:/data
      # Example recording source mounts
      # - /mnt/user/recordings:/mnt/recordings:ro
      # - /mnt/user/nvidia:/mnt/nvidia:ro
    restart: unless-stopped

volumes:
  webclipper_data:
