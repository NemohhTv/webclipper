version: "3.8"

services:
  webclipper:
    build: .
    container_name: webclipper
    ports:
      - "9069:9069"
    environment:
      WEBCLIPPER_DATA_DIR: /data
    volumes:
      - webclipper_data:/data
      - /volume1/Recordings:/mnt/recordings
    restart: unless-stopped

volumes:
  webclipper_data:
