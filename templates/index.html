<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebClipper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #07101f;
      --panel: #0f1b2f;
      --panel-2: #14233c;
      --border: #223657;
      --text: #eef4ff;
      --muted: #9eb2d4;
      --accent: #5aa8ff;
      --danger: #ff7b8f;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: linear-gradient(180deg, #04101f 0%, #07101f 100%);
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      padding: 22px;
      background: rgba(4, 12, 25, 0.92);
    }

    .main {
      padding: 22px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    h2, h3 {
      margin: 0 0 16px;
      font-weight: 800;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .label {
      font-size: 14px;
      color: var(--muted);
    }

    input, select, button {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      transition: 0.15s ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .btn-primary {
      background: var(--accent);
      color: #061220;
      border-color: transparent;
    }

    .btn-danger {
      background: rgba(255, 123, 143, 0.08);
      color: #ffc2cb;
      border-color: rgba(255,123,143,.35);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-row > * {
      flex: 1;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab {
      width: auto;
      padding: 12px 18px;
    }

    .tab.active {
      background: var(--accent);
      color: #061220;
      border-color: transparent;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar select {
      max-width: 260px;
    }

    .status {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--panel);
    }

    .status.show {
      display: block;
    }

    .status.error {
      color: #ffd1d8;
      background: rgba(255,123,143,.08);
      border-color: rgba(255,123,143,.35);
    }

    .status.success {
      color: #dcecff;
      background: rgba(90,168,255,.08);
      border-color: rgba(90,168,255,.35);
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .recording-card {
      display: grid;
      grid-template-columns: 26px 160px 1fr auto;
      gap: 12px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
    }

    .clip-card {
      display: grid;
      grid-template-columns: 26px 1fr auto;
      gap: 12px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
    }

    .thumb {
      width: 160px;
      height: 90px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #000;
    }

    .title {
      font-weight: 800;
      margin-bottom: 6px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      word-break: break-all;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .hidden {
      display: none !important;
    }

    .video-wrap {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      margin-bottom: 14px;
    }

    video {
      width: 100%;
      max-height: 560px;
      display: block;
      background: #000;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .sources-list {
      display: grid;
      gap: 10px;
    }

    .source-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
    }

    .source-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 18, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 9999;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(820px, 100%);
      max-height: 85vh;
      overflow: hidden;
      background: #0d182b;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto auto auto 1fr;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 20px 12px;
      border-bottom: 1px solid rgba(255,255,255,.04);
    }

    .modal-sub {
      padding: 0 20px 16px;
      color: var(--muted);
      word-break: break-all;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      padding: 0 20px 16px;
    }

    .browser-list {
      overflow: auto;
      padding: 0 20px 20px;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .browser-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .browser-name {
      font-weight: 700;
    }

    .browser-empty {
      color: var(--muted);
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.02);
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .recording-card {
        grid-template-columns: 26px 120px 1fr;
      }

      .actions {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }

      .two-col {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">WebClipper</div>

      <div class="panel">
        <h3>Add Source</h3>

        <div class="field">
          <label class="label">Source Name</label>
          <input id="sourceLabel" placeholder="Elgato" />
        </div>

        <div class="field">
          <label class="label">Container Path</label>
          <input id="sourcePath" placeholder="/mnt/Recordings/Elgato" />
        </div>

        <div class="btn-row">
          <button id="browseSourceBtn">Browse</button>
          <button id="addSourceBtn" class="btn-primary">Add Source</button>
        </div>

        <div class="muted" style="margin-top: 12px;">
          Use paths that exist inside the container.
        </div>
      </div>

      <div class="panel">
        <h3>Settings</h3>

        <div class="field">
          <label class="label">Auto Refresh</label>
          <select id="autoRefresh">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
          </select>
        </div>

        <div class="field">
          <label class="label">Refresh Interval (seconds)</label>
          <input id="refreshInterval" type="number" min="5" max="3600" />
        </div>

        <div class="field">
          <label class="label">Clips Save Folder</label>
          <input id="clipsPath" placeholder="/data/clips" />
        </div>

        <div class="btn-row">
          <button id="browseClipsBtn">Browse</button>
          <button id="saveSettingsBtn" class="btn-primary">Save</button>
        </div>
      </div>

      <div class="panel">
        <h3>Sources</h3>
        <div id="sourcesList" class="sources-list"></div>
      </div>
    </aside>

    <main class="main">
      <div id="statusBox" class="status"></div>

      <div class="tabs">
        <button class="tab active" data-tab="recordingsTab">Recordings</button>
        <button class="tab" data-tab="clipsTab">Clips</button>
      </div>

      <section id="recordingsTab">
        <div class="panel">
          <div class="toolbar">
            <select id="sourceFilter">
              <option value="">All Sources</option>
            </select>
            <button id="reloadRecordingsBtn">Reload</button>
            <button id="deleteSelectedRecordingsBtn" class="btn-danger">Delete Selected</button>
          </div>
        </div>

        <div class="panel hidden" id="playerPanel">
          <h3 id="playerTitle">Preview</h3>

          <div class="video-wrap">
            <video id="videoPlayer" controls preload="metadata"></video>
          </div>

          <div class="two-col">
            <div class="field">
              <label class="label">Clip Title</label>
              <input id="clipTitle" placeholder="Clip title" />
            </div>
            <div class="field">
              <label class="label">Game</label>
              <input id="clipGame" placeholder="Game name" value="Unknown" />
            </div>
          </div>

          <div class="two-col">
            <div class="field">
              <label class="label">Start (seconds)</label>
              <input id="clipStart" type="number" min="0" step="0.01" value="0" />
            </div>
            <div class="field">
              <label class="label">End (seconds)</label>
              <input id="clipEnd" type="number" min="0" step="0.01" value="0" />
            </div>
          </div>

          <div class="toolbar">
            <button id="setStartBtn">Set Start From Current Time</button>
            <button id="setEndBtn">Set End From Current Time</button>
            <label style="display:flex;align-items:center;gap:8px;margin-left:auto;">
              <input id="losslessClip" type="checkbox" checked style="width:auto;" />
              <span class="label" style="margin:0;">Lossless Cut</span>
            </label>
            <button id="createClipBtn" class="btn-primary" style="width:auto;">Create Clip</button>
          </div>
        </div>

        <div id="recordingsList" class="grid"></div>
      </section>

      <section id="clipsTab" class="hidden">
        <div class="panel">
          <div class="toolbar">
            <button id="reloadClipsBtn">Reload</button>
            <button id="deleteSelectedClipsBtn" class="btn-danger">Delete Selected</button>
          </div>
        </div>

        <div id="clipsList" class="grid"></div>
      </section>
    </main>
  </div>

  <div id="browserModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h2>Folder Browser</h2>
        <button id="closeBrowserBtn" style="width:auto;">Close</button>
      </div>

      <div id="browserPath" class="modal-sub">/</div>

      <div class="modal-actions">
        <button id="browserUpBtn" style="width:auto;">Up</button>
        <button id="browserChooseBtn" class="btn-primary" style="width:auto;">Use This Folder</button>
      </div>

      <div id="browserList" class="browser-list"></div>
    </div>
  </div>

  <script>
    const state = {
      selectedRecordingPaths: new Set(),
      selectedClipPaths: new Set(),
      currentRecording: null,
      browserTarget: null,
      browserCurrentPath: "/",
      autoRefreshTimer: null,
    };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showStatus(message, type = "success") {
      const box = $("statusBox");
      box.textContent = message;
      box.className = `status show ${type}`;
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => {
        box.className = "status";
      }, 3500);
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });

      const text = await response.text();
      let data = {};
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        throw new Error(text || `Request failed: ${response.status}`);
      }

      if (!response.ok) {
        throw new Error(data.detail || `Request failed: ${response.status}`);
      }

      return data;
    }

    function fmtBytes(bytes = 0) {
      const units = ["B", "KB", "MB", "GB", "TB"];
      let i = 0;
      let n = bytes;
      while (n >= 1024 && i < units.length - 1) {
        n /= 1024;
        i++;
      }
      return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function fmtDate(ts) {
      return new Date(ts * 1000).toLocaleString();
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tabId);
      });
      $("recordingsTab").classList.toggle("hidden", tabId !== "recordingsTab");
      $("clipsTab").classList.toggle("hidden", tabId !== "clipsTab");
    }

    async function loadSources() {
      const data = await api("/api/sources");
      const wrap = $("sourcesList");
      const filter = $("sourceFilter");

      wrap.innerHTML = "";
      filter.innerHTML = `<option value="">All Sources</option>`;

      for (const source of data.sources) {
        const el = document.createElement("div");
        el.className = "source-item";
        el.innerHTML = `
          <div class="source-head">
            <div>
              <div class="title">${escapeHtml(source.label)}</div>
              <div class="meta">${escapeHtml(source.path)}</div>
              <div class="meta">${source.count} recordings</div>
            </div>
            <button class="btn-danger" data-remove="${escapeHtml(source.label)}" style="width:auto;">Remove</button>
          </div>
        `;
        wrap.appendChild(el);

        const opt = document.createElement("option");
        opt.value = source.label;
        opt.textContent = source.label;
        filter.appendChild(opt);
      }

      wrap.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const label = btn.getAttribute("data-remove");
          if (!confirm(`Remove source "${label}"?`)) return;
          try {
            await api(`/api/sources/${encodeURIComponent(label)}`, { method: "DELETE" });
            showStatus(`Removed source: ${label}`);
            await Promise.all([loadSources(), loadRecordings()]);
          } catch (err) {
            showStatus(err.message, "error");
          }
        });
      });
    }

    async function loadSettings() {
      const data = await api("/api/settings");
      $("autoRefresh").value = String(data.auto_refresh);
      $("refreshInterval").value = data.refresh_interval;
      $("clipsPath").value = data.clips_path || "/data/clips";
      resetAutoRefresh();
    }

    async function saveSettings() {
      await api("/api/settings", {
        method: "PUT",
        body: JSON.stringify({
          auto_refresh: $("autoRefresh").value === "true",
          refresh_interval: Number($("refreshInterval").value || 20),
          clips_path: $("clipsPath").value.trim(),
        }),
      });
      showStatus("Settings saved");
      resetAutoRefresh();
    }

    async function loadRecordings() {
      const source = $("sourceFilter").value;
      const query = source ? `?source=${encodeURIComponent(source)}` : "";
      const data = await api(`/api/recordings${query}`);
      const list = $("recordingsList");
      list.innerHTML = "";

      for (const rec of data.recordings) {
        const checked = state.selectedRecordingPaths.has(rec.path) ? "checked" : "";
        const card = document.createElement("div");
        card.className = "recording-card";
        card.innerHTML = `
          <input type="checkbox" data-recording="${escapeHtml(rec.path)}" ${checked} style="width:auto;" />
          <img class="thumb" src="/api/recordings/thumbnail?path=${encodeURIComponent(rec.path)}&time=1" alt="" loading="lazy" />
          <div>
            <div class="title">${escapeHtml(rec.name)}</div>
            <div class="meta">${escapeHtml(rec.source)} • ${fmtBytes(rec.size)}</div>
            <div class="meta">${fmtDate(rec.modified)}</div>
            <div class="meta">${escapeHtml(rec.path)}</div>
          </div>
          <div class="actions">
            <button data-preview="${escapeHtml(rec.path)}" style="width:auto;">Preview</button>
          </div>
        `;
        list.appendChild(card);
      }

      list.querySelectorAll("[data-recording]").forEach((cb) => {
        cb.addEventListener("change", () => {
          const path = cb.getAttribute("data-recording");
          if (cb.checked) state.selectedRecordingPaths.add(path);
          else state.selectedRecordingPaths.delete(path);
        });
      });

      list.querySelectorAll("[data-preview]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const path = btn.getAttribute("data-preview");
          const rec = data.recordings.find((r) => r.path === path);
          if (rec) await previewRecording(rec);
        });
      });
    }

    async function previewRecording(rec) {
      state.currentRecording = rec;
      $("playerPanel").classList.remove("hidden");
      $("playerTitle").textContent = rec.name;

      const info = await api(`/api/recordings/info?path=${encodeURIComponent(rec.path)}`);
      const player = $("videoPlayer");
      player.src = `/stream?path=${encodeURIComponent(rec.path)}&transcode=${info.needs_transcode_preview ? "true" : "false"}`;
      player.load();

      $("clipTitle").value = rec.name.replace(/\.[^.]+$/, "");
      $("clipGame").value = "Unknown";
      $("clipStart").value = "0";
      $("clipEnd").value = String(Number(info.duration || 0).toFixed(2));

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function createClip() {
      if (!state.currentRecording) {
        showStatus("Pick a recording first", "error");
        return;
      }

      const payload = {
        filepath: state.currentRecording.path,
        source_label: state.currentRecording.source,
        start: Number($("clipStart").value || 0),
        end: Number($("clipEnd").value || 0),
        title: $("clipTitle").value.trim() || "clip",
        game: $("clipGame").value.trim() || "Unknown",
        lossless: $("losslessClip").checked,
      };

      if (payload.end <= payload.start) {
        showStatus("End time must be greater than start time", "error");
        return;
      }

      await api("/api/clip", {
        method: "POST",
        body: JSON.stringify(payload),
      });

      showStatus("Clip created");
      await loadClips();
      switchTab("clipsTab");
    }

    async function loadClips() {
      const data = await api("/api/clips");
      const list = $("clipsList");
      list.innerHTML = "";

      for (const clip of data.clips) {
        const checked = state.selectedClipPaths.has(clip.path) ? "checked" : "";
        const card = document.createElement("div");
        card.className = "clip-card";
        card.innerHTML = `
          <input type="checkbox" data-clip="${escapeHtml(clip.path)}" ${checked} style="width:auto;" />
          <div>
            <div class="title">${escapeHtml(clip.name)}</div>
            <div class="meta">${fmtBytes(clip.size)} • ${fmtDate(clip.modified)}</div>
            <div class="meta">${escapeHtml(clip.path)}</div>
          </div>
          <div class="actions">
            <button data-play="${escapeHtml(clip.path)}" style="width:auto;">Play</button>
            <a href="/api/clips/download?path=${encodeURIComponent(clip.path)}">
              <button type="button" style="width:auto;">Download</button>
            </a>
          </div>
        `;
        list.appendChild(card);
      }

      list.querySelectorAll("[data-clip]").forEach((cb) => {
        cb.addEventListener("change", () => {
          const path = cb.getAttribute("data-clip");
          if (cb.checked) state.selectedClipPaths.add(path);
          else state.selectedClipPaths.delete(path);
        });
      });

      list.querySelectorAll("[data-play]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const path = btn.getAttribute("data-play");
          switchTab("recordingsTab");
          $("playerPanel").classList.remove("hidden");
          $("playerTitle").textContent = path.split("/").pop();
          $("videoPlayer").src = `/stream/clip?path=${encodeURIComponent(path)}`;
          $("videoPlayer").load();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    async function deleteSelectedRecordings() {
      const paths = [...state.selectedRecordingPaths];
      if (!paths.length) {
        showStatus("No recordings selected", "error");
        return;
      }
      if (!confirm(`Delete ${paths.length} recording(s)?`)) return;

      const result = await api("/api/recordings/delete", {
        method: "POST",
        body: JSON.stringify({ paths }),
      });

      state.selectedRecordingPaths.clear();
      showStatus(`Deleted ${result.deleted} recording(s)`);
      await loadRecordings();
    }

    async function deleteSelectedClips() {
      const paths = [...state.selectedClipPaths];
      if (!paths.length) {
        showStatus("No clips selected", "error");
        return;
      }
      if (!confirm(`Delete ${paths.length} clip(s)?`)) return;

      const result = await api("/api/clips/delete", {
        method: "POST",
        body: JSON.stringify({ paths }),
      });

      state.selectedClipPaths.clear();
      showStatus(`Deleted ${result.deleted} clip(s)`);
      await loadClips();
    }

    async function addSource() {
      const label = $("sourceLabel").value.trim();
      const path = $("sourcePath").value.trim();

      if (!label || !path) {
        showStatus("Label and path are required", "error");
        return;
      }

      await api("/api/sources", {
        method: "POST",
        body: JSON.stringify({ label, path }),
      });

      $("sourceLabel").value = "";
      showStatus("Source added");
      await Promise.all([loadSources(), loadRecordings()]);
    }

    function openBrowser(target) {
      state.browserTarget = target;
      $("browserModal").classList.add("show");
      browse(target === "clips" ? ($("clipsPath").value.trim() || "/") : "/mnt/Recordings");
    }

    function closeBrowser() {
      $("browserModal").classList.remove("show");
    }

    async function browse(path = "/") {
      try {
        const data = await api(`/api/browse?path=${encodeURIComponent(path)}`);
        state.browserCurrentPath = data.path;
        $("browserPath").textContent = data.path;

        const list = $("browserList");
        list.innerHTML = "";

        if (!data.directories.length) {
          const empty = document.createElement("div");
          empty.className = "browser-empty";
          empty.textContent = "No folders found here. If you expected mounted media folders, your Docker volume mapping is missing or the host path is wrong.";
          list.appendChild(empty);
          return;
        }

        for (const dir of data.directories) {
          const row = document.createElement("div");
          row.className = "browser-item";
          row.innerHTML = `
            <div class="browser-name">${escapeHtml(dir.name)}</div>
            <button data-open="${escapeHtml(dir.path)}" style="width:auto;">Open</button>
          `;
          list.appendChild(row);
        }

        list.querySelectorAll("[data-open]").forEach((btn) => {
          btn.addEventListener("click", () => browse(btn.getAttribute("data-open")));
        });
      } catch (err) {
        showStatus(err.message, "error");
      }
    }

    function chooseBrowserPath() {
      if (state.browserTarget === "source") {
        $("sourcePath").value = state.browserCurrentPath;
      } else if (state.browserTarget === "clips") {
        $("clipsPath").value = state.browserCurrentPath;
      }
      closeBrowser();
    }

    function resetAutoRefresh() {
      if (state.autoRefreshTimer) {
        clearInterval(state.autoRefreshTimer);
        state.autoRefreshTimer = null;
      }

      const enabled = $("autoRefresh").value === "true";
      const seconds = Number($("refreshInterval").value || 20);

      if (enabled && seconds >= 5) {
        state.autoRefreshTimer = setInterval(async () => {
          try {
            await loadSources();
            await loadRecordings();
            await loadClips();
          } catch (_) {}
        }, seconds * 1000);
      }
    }

    function bindEvents() {
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.addEventListener("click", () => switchTab(btn.dataset.tab));
      });

      $("addSourceBtn").addEventListener("click", async () => {
        try {
          await addSource();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("saveSettingsBtn").addEventListener("click", async () => {
        try {
          await saveSettings();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("reloadRecordingsBtn").addEventListener("click", async () => {
        try {
          await loadRecordings();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("reloadClipsBtn").addEventListener("click", async () => {
        try {
          await loadClips();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("sourceFilter").addEventListener("change", async () => {
        try {
          await loadRecordings();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("deleteSelectedRecordingsBtn").addEventListener("click", async () => {
        try {
          await deleteSelectedRecordings();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("deleteSelectedClipsBtn").addEventListener("click", async () => {
        try {
          await deleteSelectedClips();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("setStartBtn").addEventListener("click", () => {
        $("clipStart").value = Number($("videoPlayer").currentTime || 0).toFixed(2);
      });

      $("setEndBtn").addEventListener("click", () => {
        $("clipEnd").value = Number($("videoPlayer").currentTime || 0).toFixed(2);
      });

      $("createClipBtn").addEventListener("click", async () => {
        try {
          await createClip();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("browseSourceBtn").addEventListener("click", () => openBrowser("source"));
      $("browseClipsBtn").addEventListener("click", () => openBrowser("clips"));
      $("closeBrowserBtn").addEventListener("click", closeBrowser);
      $("browserChooseBtn").addEventListener("click", chooseBrowserPath);

      $("browserUpBtn").addEventListener("click", async () => {
        const current = state.browserCurrentPath || "/";
        const parent = current === "/" ? "/" : current.split("/").slice(0, -1).join("/") || "/";
        await browse(parent);
      });

      $("browserModal").addEventListener("click", (e) => {
        if (e.target === $("browserModal")) closeBrowser();
      });

      $("autoRefresh").addEventListener("change", resetAutoRefresh);
      $("refreshInterval").addEventListener("change", resetAutoRefresh);
    }

    async function boot() {
      bindEvents();
      try {
        await loadSettings();
        await loadSources();
        await loadRecordings();
        await loadClips();
      } catch (err) {
        showStatus(err.message, "error");
      }
    }

    boot();
  </script>
</body>
</html>
