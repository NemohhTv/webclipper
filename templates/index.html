<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebClipper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2b;
      --panel-2: #162238;
      --muted: #8ea1c0;
      --text: #e8eefc;
      --accent: #4ea1ff;
      --danger: #ff5d73;
      --border: #22314f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: #0a101c;
      padding: 20px;
    }

    .main {
      padding: 20px;
    }

    h1, h2, h3 {
      margin: 0 0 14px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    input, select, button {
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
    }

    button {
      cursor: pointer;
      background: #1a2a46;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      color: #06111f;
      font-weight: 700;
      border-color: transparent;
    }

    button.danger {
      background: rgba(255, 93, 115, 0.12);
      color: #ffb6c0;
      border-color: rgba(255, 93, 115, 0.35);
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      padding: 10px 14px;
    }

    .tab.active {
      background: var(--accent);
      color: #06111f;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .recording, .source-item, .clip-item {
      display: grid;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .recording {
      grid-template-columns: 26px 160px 1fr auto;
      align-items: center;
    }

    .clip-item {
      grid-template-columns: 26px 1fr auto;
      align-items: center;
    }

    .thumb {
      width: 160px;
      height: 90px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #000;
    }

    .title {
      font-weight: 700;
      font-size: 14px;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .video-wrap {
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    video {
      width: 100%;
      max-height: 560px;
      background: #000;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .status {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.error {
      border-color: rgba(255, 93, 115, 0.35);
      color: #ffd1d7;
      background: rgba(255, 93, 115, 0.08);
    }

    .status.success {
      border-color: rgba(78, 161, 255, 0.35);
      color: #dcecff;
      background: rgba(78, 161, 255, 0.08);
    }

    .source-path {
      word-break: break-all;
    }

    .browser-list {
      max-height: 220px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      background: #0d1627;
    }

    .browser-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
    }

    .browser-item:hover {
      background: #13203a;
    }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--border); }
      .recording { grid-template-columns: 26px 120px 1fr; }
      .actions { grid-column: 1 / -1; justify-content: flex-start; }
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">WebClipper</div>

      <div class="panel">
        <h3>Add Source</h3>
        <div class="stack">
          <input id="sourceLabel" placeholder="Source label, like Nvidia" />
          <input id="sourcePath" placeholder="Container path, like /mnt/recordings/Nvidia" />
          <div class="row">
            <button id="browseRootBtn">Browse</button>
            <button id="addSourceBtn" class="primary">Add Source</button>
          </div>
          <div class="muted">Use container paths, not Windows host paths.</div>
        </div>
      </div>

      <div class="panel">
        <h3>Settings</h3>
        <div class="stack">
          <label class="muted">Auto refresh</label>
          <select id="autoRefresh">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
          </select>

          <label class="muted">Refresh interval (seconds)</label>
          <input id="refreshInterval" type="number" min="5" max="3600" />

          <label class="muted">Clips save folder</label>
          <input id="clipsPath" placeholder="/data/clips" />

          <div class="row">
            <button id="browseClipsBtn">Browse</button>
            <button id="saveSettingsBtn" class="primary">Save</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>Sources</h3>
        <div id="sourcesList" class="grid"></div>
      </div>

      <div class="panel hidden" id="browserPanel">
        <div class="row" style="justify-content: space-between;">
          <h3>Folder Browser</h3>
          <button id="closeBrowserBtn">Close</button>
        </div>
        <div class="muted" id="browserPath">/</div>
        <div class="row" style="margin: 10px 0;">
          <button id="browserUpBtn">Up</button>
          <button id="browserChooseBtn" class="primary">Use This Folder</button>
        </div>
        <div class="browser-list" id="browserList"></div>
      </div>
    </aside>

    <main class="main">
      <div id="statusBox" class="status"></div>

      <div class="tabs">
        <button class="tab active" data-tab="recordingsTab">Recordings</button>
        <button class="tab" data-tab="clipsTab">Clips</button>
      </div>

      <section id="recordingsTab">
        <div class="panel">
          <div class="row">
            <select id="sourceFilter" style="max-width: 260px;">
              <option value="">All Sources</option>
            </select>
            <button id="reloadRecordingsBtn">Reload</button>
            <button id="deleteSelectedRecordingsBtn" class="danger">Delete Selected</button>
          </div>
        </div>

        <div class="panel hidden" id="playerPanel">
          <h3 id="playerTitle">Preview</h3>
          <div class="video-wrap">
            <video id="videoPlayer" controls preload="metadata"></video>
          </div>

          <div class="two-col">
            <div class="stack">
              <label class="muted">Clip title</label>
              <input id="clipTitle" placeholder="Clip title" />
            </div>
            <div class="stack">
              <label class="muted">Game</label>
              <input id="clipGame" placeholder="Game name" value="Unknown" />
            </div>
          </div>

          <div class="two-col" style="margin-top: 12px;">
            <div class="stack">
              <label class="muted">Start (seconds)</label>
              <input id="clipStart" type="number" min="0" step="0.01" value="0" />
            </div>
            <div class="stack">
              <label class="muted">End (seconds)</label>
              <input id="clipEnd" type="number" min="0" step="0.01" value="0" />
            </div>
          </div>

          <div class="row" style="margin-top: 12px;">
            <button id="setStartBtn">Set Start From Current Time</button>
            <button id="setEndBtn">Set End From Current Time</button>
            <label class="row" style="margin-left: auto;">
              <input type="checkbox" id="losslessClip" checked style="width:auto;" />
              <span class="muted">Lossless cut</span>
            </label>
            <button id="createClipBtn" class="primary">Create Clip</button>
          </div>
        </div>

        <div id="recordingsList" class="grid"></div>
      </section>

      <section id="clipsTab" class="hidden">
        <div class="panel">
          <div class="row">
            <button id="reloadClipsBtn">Reload</button>
            <button id="deleteSelectedClipsBtn" class="danger">Delete Selected</button>
          </div>
        </div>
        <div id="clipsList" class="grid"></div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      selectedRecordingPaths: new Set(),
      selectedClipPaths: new Set(),
      currentRecording: null,
      browserTarget: null,
      browserCurrentPath: "/",
      autoRefreshTimer: null,
    };

    const $ = (id) => document.getElementById(id);

    function showStatus(message, type = "success") {
      const box = $("statusBox");
      box.textContent = message;
      box.className = `status show ${type}`;
      clearTimeout(showStatus._timer);
      showStatus._timer = setTimeout(() => {
        box.className = "status";
      }, 3500);
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });

      const text = await response.text();
      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        throw new Error(text || `Request failed: ${response.status}`);
      }

      if (!response.ok) {
        throw new Error(data.detail || `Request failed: ${response.status}`);
      }

      return data;
    }

    function fmtBytes(bytes = 0) {
      const units = ["B", "KB", "MB", "GB", "TB"];
      let i = 0;
      let n = bytes;
      while (n >= 1024 && i < units.length - 1) {
        n /= 1024;
        i++;
      }
      return `${n.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function fmtDate(ts) {
      return new Date(ts * 1000).toLocaleString();
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tabId);
      });

      $("recordingsTab").classList.toggle("hidden", tabId !== "recordingsTab");
      $("clipsTab").classList.toggle("hidden", tabId !== "clipsTab");
    }

    async function loadSources() {
      const data = await api("/api/sources");
      const list = $("sourcesList");
      const filter = $("sourceFilter");

      list.innerHTML = "";
      filter.innerHTML = `<option value="">All Sources</option>`;

      for (const source of data.sources) {
        const card = document.createElement("div");
        card.className = "source-item";
        card.innerHTML = `
          <div class="title">${escapeHtml(source.label)}</div>
          <div class="meta source-path">${escapeHtml(source.path)}</div>
          <div class="meta">${source.count} recordings</div>
          <div class="actions">
            <button class="danger" data-remove-source="${escapeAttr(source.label)}">Remove</button>
          </div>
        `;
        list.appendChild(card);

        const opt = document.createElement("option");
        opt.value = source.label;
        opt.textContent = source.label;
        filter.appendChild(opt);
      }

      list.querySelectorAll("[data-remove-source]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const label = btn.getAttribute("data-remove-source");
          if (!confirm(`Remove source "${label}"?`)) return;

          try {
            await api(`/api/sources/${encodeURIComponent(label)}`, { method: "DELETE" });
            showStatus(`Removed source: ${label}`);
            await Promise.all([loadSources(), loadRecordings()]);
          } catch (err) {
            showStatus(err.message, "error");
          }
        });
      });
    }

    async function loadSettings() {
      const data = await api("/api/settings");
      $("autoRefresh").value = String(data.auto_refresh);
      $("refreshInterval").value = data.refresh_interval;
      $("clipsPath").value = data.clips_path || "/data/clips";

      resetAutoRefresh();
    }

    async function saveSettings() {
      await api("/api/settings", {
        method: "PUT",
        body: JSON.stringify({
          auto_refresh: $("autoRefresh").value === "true",
          refresh_interval: Number($("refreshInterval").value || 20),
          clips_path: $("clipsPath").value.trim(),
        }),
      });

      showStatus("Settings saved");
      resetAutoRefresh();
    }

    async function loadRecordings() {
      const source = $("sourceFilter").value;
      const query = source ? `?source=${encodeURIComponent(source)}` : "";
      const data = await api(`/api/recordings${query}`);
      const list = $("recordingsList");
      list.innerHTML = "";

      for (const rec of data.recordings) {
        const checked = state.selectedRecordingPaths.has(rec.path) ? "checked" : "";
        const card = document.createElement("div");
        card.className = "recording";

        const thumbUrl = `/api/recordings/thumbnail?path=${encodeURIComponent(rec.path)}&time=1`;

        card.innerHTML = `
          <input type="checkbox" data-recording-checkbox="${escapeAttr(rec.path)}" ${checked} style="width:auto;" />
          <img class="thumb" src="${thumbUrl}" alt="" loading="lazy" />
          <div>
            <div class="title">${escapeHtml(rec.name)}</div>
            <div class="meta">${escapeHtml(rec.source)} • ${fmtBytes(rec.size)}</div>
            <div class="meta">${fmtDate(rec.modified)}</div>
            <div class="meta source-path">${escapeHtml(rec.path)}</div>
          </div>
          <div class="actions">
            <button data-preview="${escapeAttr(rec.path)}">Preview</button>
          </div>
        `;

        list.appendChild(card);
      }

      list.querySelectorAll("[data-recording-checkbox]").forEach((cb) => {
        cb.addEventListener("change", () => {
          const path = cb.getAttribute("data-recording-checkbox");
          if (cb.checked) state.selectedRecordingPaths.add(path);
          else state.selectedRecordingPaths.delete(path);
        });
      });

      list.querySelectorAll("[data-preview]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const path = btn.getAttribute("data-preview");
          const rec = data.recordings.find((r) => r.path === path);
          if (rec) {
            await previewRecording(rec);
          }
        });
      });
    }

    async function previewRecording(rec) {
      state.currentRecording = rec;
      $("playerPanel").classList.remove("hidden");
      $("playerTitle").textContent = rec.name;

      const info = await api(`/api/recordings/info?path=${encodeURIComponent(rec.path)}`);
      const video = $("videoPlayer");
      const url = `/stream?path=${encodeURIComponent(rec.path)}&transcode=${info.needs_transcode_preview ? "true" : "false"}`;
      video.src = url;
      video.load();

      $("clipTitle").value = rec.name.replace(/\.[^.]+$/, "");
      $("clipGame").value = "Unknown";
      $("clipStart").value = "0";
      $("clipEnd").value = String(Number(info.duration || 0).toFixed(2));
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function createClip() {
      if (!state.currentRecording) {
        showStatus("Pick a recording first", "error");
        return;
      }

      const payload = {
        filepath: state.currentRecording.path,
        source_label: state.currentRecording.source,
        start: Number($("clipStart").value || 0),
        end: Number($("clipEnd").value || 0),
        title: $("clipTitle").value.trim() || "clip",
        game: $("clipGame").value.trim() || "Unknown",
        lossless: $("losslessClip").checked,
      };

      if (payload.end <= payload.start) {
        showStatus("End time must be greater than start time", "error");
        return;
      }

      await api("/api/clip", {
        method: "POST",
        body: JSON.stringify(payload),
      });

      showStatus("Clip created");
      await loadClips();
      switchTab("clipsTab");
    }

    async function loadClips() {
      const data = await api("/api/clips");
      const list = $("clipsList");
      list.innerHTML = "";

      for (const clip of data.clips) {
        const checked = state.selectedClipPaths.has(clip.path) ? "checked" : "";
        const card = document.createElement("div");
        card.className = "clip-item";
        card.innerHTML = `
          <input type="checkbox" data-clip-checkbox="${escapeAttr(clip.path)}" ${checked} style="width:auto;" />
          <div>
            <div class="title">${escapeHtml(clip.name)}</div>
            <div class="meta">${fmtBytes(clip.size)} • ${fmtDate(clip.modified)}</div>
            <div class="meta source-path">${escapeHtml(clip.path)}</div>
          </div>
          <div class="actions">
            <button data-play-clip="${escapeAttr(clip.path)}">Play</button>
            <a href="/api/clips/download?path=${encodeURIComponent(clip.path)}"><button>Download</button></a>
          </div>
        `;
        list.appendChild(card);
      }

      list.querySelectorAll("[data-clip-checkbox]").forEach((cb) => {
        cb.addEventListener("change", () => {
          const path = cb.getAttribute("data-clip-checkbox");
          if (cb.checked) state.selectedClipPaths.add(path);
          else state.selectedClipPaths.delete(path);
        });
      });

      list.querySelectorAll("[data-play-clip]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const path = btn.getAttribute("data-play-clip");
          const player = $("videoPlayer");
          $("playerPanel").classList.remove("hidden");
          switchTab("recordingsTab");
          $("playerTitle").textContent = path.split("/").pop();
          player.src = `/stream/clip?path=${encodeURIComponent(path)}`;
          player.load();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    async function deleteSelectedRecordings() {
      const paths = [...state.selectedRecordingPaths];
      if (!paths.length) {
        showStatus("No recordings selected", "error");
        return;
      }

      if (!confirm(`Delete ${paths.length} recording(s)?`)) return;

      const result = await api("/api/recordings/delete", {
        method: "POST",
        body: JSON.stringify({ paths }),
      });

      state.selectedRecordingPaths.clear();
      showStatus(`Deleted ${result.deleted} recording(s)`);
      await loadRecordings();
    }

    async function deleteSelectedClips() {
      const paths = [...state.selectedClipPaths];
      if (!paths.length) {
        showStatus("No clips selected", "error");
        return;
      }

      if (!confirm(`Delete ${paths.length} clip(s)?`)) return;

      const result = await api("/api/clips/delete", {
        method: "POST",
        body: JSON.stringify({ paths }),
      });

      state.selectedClipPaths.clear();
      showStatus(`Deleted ${result.deleted} clip(s)`);
      await loadClips();
    }

    async function addSource() {
      const label = $("sourceLabel").value.trim();
      const path = $("sourcePath").value.trim();

      if (!label || !path) {
        showStatus("Label and path are required", "error");
        return;
      }

      await api("/api/sources", {
        method: "POST",
        body: JSON.stringify({ label, path }),
      });

      $("sourceLabel").value = "";
      showStatus("Source added");
      await Promise.all([loadSources(), loadRecordings()]);
    }

    async function browse(path = "/") {
      const data = await api(`/api/browse?path=${encodeURIComponent(path)}`);
      state.browserCurrentPath = data.path;
      $("browserPanel").classList.remove("hidden");
      $("browserPath").textContent = data.path;

      const list = $("browserList");
      list.innerHTML = "";

      for (const dir of data.directories) {
        const row = document.createElement("div");
        row.className = "browser-item";
        row.innerHTML = `
          <div>${escapeHtml(dir.name)}</div>
          <button data-open-dir="${escapeAttr(dir.path)}">Open</button>
        `;
        list.appendChild(row);
      }

      list.querySelectorAll("[data-open-dir]").forEach((btn) => {
        btn.addEventListener("click", () => browse(btn.getAttribute("data-open-dir")));
      });
    }

    function chooseBrowserPath() {
      if (state.browserTarget === "source") {
        $("sourcePath").value = state.browserCurrentPath;
      } else if (state.browserTarget === "clips") {
        $("clipsPath").value = state.browserCurrentPath;
      }
      $("browserPanel").classList.add("hidden");
    }

    function resetAutoRefresh() {
      if (state.autoRefreshTimer) {
        clearInterval(state.autoRefreshTimer);
        state.autoRefreshTimer = null;
      }

      const enabled = $("autoRefresh").value === "true";
      const seconds = Number($("refreshInterval").value || 20);

      if (enabled && seconds >= 5) {
        state.autoRefreshTimer = setInterval(async () => {
          try {
            await loadRecordings();
            await loadClips();
            await loadSources();
          } catch (_) {}
        }, seconds * 1000);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function bindEvents() {
      document.querySelectorAll(".tab").forEach((btn) => {
        btn.addEventListener("click", () => switchTab(btn.dataset.tab));
      });

      $("addSourceBtn").addEventListener("click", async () => {
        try {
          await addSource();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("saveSettingsBtn").addEventListener("click", async () => {
        try {
          await saveSettings();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("reloadRecordingsBtn").addEventListener("click", async () => {
        try {
          await loadRecordings();
          showStatus("Recordings reloaded");
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("reloadClipsBtn").addEventListener("click", async () => {
        try {
          await loadClips();
          showStatus("Clips reloaded");
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("sourceFilter").addEventListener("change", async () => {
        try {
          await loadRecordings();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("deleteSelectedRecordingsBtn").addEventListener("click", async () => {
        try {
          await deleteSelectedRecordings();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("deleteSelectedClipsBtn").addEventListener("click", async () => {
        try {
          await deleteSelectedClips();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("setStartBtn").addEventListener("click", () => {
        $("clipStart").value = Number($("videoPlayer").currentTime || 0).toFixed(2);
      });

      $("setEndBtn").addEventListener("click", () => {
        $("clipEnd").value = Number($("videoPlayer").currentTime || 0).toFixed(2);
      });

      $("createClipBtn").addEventListener("click", async () => {
        try {
          await createClip();
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("browseRootBtn").addEventListener("click", async () => {
        state.browserTarget = "source";
        try {
          await browse("/");
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("browseClipsBtn").addEventListener("click", async () => {
        state.browserTarget = "clips";
        try {
          await browse("/");
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("browserChooseBtn").addEventListener("click", chooseBrowserPath);
      $("closeBrowserBtn").addEventListener("click", () => $("browserPanel").classList.add("hidden"));
      $("browserUpBtn").addEventListener("click", async () => {
        const current = state.browserCurrentPath || "/";
        const parent = current === "/" ? "/" : current.split("/").slice(0, -1).join("/") || "/";
        try {
          await browse(parent);
        } catch (err) {
          showStatus(err.message, "error");
        }
      });

      $("autoRefresh").addEventListener("change", resetAutoRefresh);
      $("refreshInterval").addEventListener("change", resetAutoRefresh);
    }

    async function boot() {
      bindEvents();
      try {
        await loadSettings();
        await loadSources();
        await loadRecordings();
        await loadClips();
      } catch (err) {
        showStatus(err.message, "error");
      }
    }

    boot();
  </script>
</body>
</html>
